<style>
/* Layout: one narrow reading column; masthead, a sticky score and tab bar, then one quiz part at a time. */

.sol-title { font: 600 13px var(--body); display: block; margin-bottom: 4px; white-space: normal; }
.pts { font: 500 12px var(--mono); color: var(--muted); margin-left: auto; white-space: nowrap; }

.big { font: 700 clamp(40px, 10vw, 60px)/1 var(--display); color: var(--primary); }

.rows { display: flex; flex-direction: column; gap: 14px; margin-top: 18px; }

@media (max-width: 640px) {

@media (prefers-reduced-motion: no-preference) {

<script>
var TF = [
  ["An LSTM has four weight blocks, whereas a GRU has three.", true,
   "LSTM uses forget, input, candidate, and output blocks: 4H(D + H + 1). GRU uses update, reset, and candidate blocks: 3H(D + H + 1)."],
  ["A GRU keeps a separate cell state c<sub>t</sub> in addition to the hidden state h<sub>t</sub>.", false,
   "A GRU merges them into a single state h<sub>t</sub>, which is fully exposed. Only the LSTM keeps both c<sub>t</sub> and h<sub>t</sub>."],
  ["The forget gate was part of the original 1997 LSTM design by Hochreiter and Schmidhuber.", false,
   "The forget gate was added later by Gers et al. (2000) so the cell can learn to reset itself."],
  ["SRU gates depend on an elementwise term v ⊙ c<sub>t−1</sub> instead of a full matrix times h<sub>t−1</sub>.", true,
   "Removing the matrix multiply on the previous state is what lets the heavy products be batched over time."],
  ["SRU computes W x<sub>t</sub>, W<sub>f</sub> x<sub>t</sub>, and W<sub>r</sub> x<sub>t</sub> for all T steps in one batched matrix multiplication.", true,
   "Only the cheap elementwise updates remain sequential, so the matrix products are fully parallel on a GPU."],
  ["In an LSTM, a forget gate value near 0 means the old cell state is kept.", false,
   "Near 1 keeps the old cell state and near 0 erases it."],
  ["Greff et al. (2017) found that one gating variant was clearly better than the standard LSTM.", false,
   "They found no variant clearly better than the standard LSTM."],
  ["The SRU highway term (1 − r<sub>t</sub>) ⊙ x<sub>t</sub> assumes D = H, or a projection of x<sub>t</sub>.", true,
   "The skip connection adds x<sub>t</sub> directly to the output, so its size must match the hidden size."],
  ["The GRU update gate z<sub>t</sub> interpolates between keeping the old state and writing the candidate.", true,
   "h<sub>t</sub> = (1 − z<sub>t</sub>) ⊙ h<sub>t−1</sub> + z<sub>t</sub> ⊙ h̃<sub>t</sub>. It acts like a combined forget and input gate."],
  ["SRU is guaranteed to train 5 to 9 times faster than a cuDNN LSTM on every task and hardware.", false,
   "Lei et al. report up to 5 to 9 times on some tasks. The gain depends on the task and the hardware."]
];

var MM_T = ["Forget gate","Input gate and candidate","Output gate","Update gate (GRU)","Reset gate (GRU)","Highway term (SRU)","Forget-bias initialization","Batched precomputation","Greff et al. (2017)","Short context, quick baseline"];
var MM_D = [
  "Skip connection (1 − r<sub>t</sub>) ⊙ x<sub>t</sub> that needs D = H or a projection",
  "Decides how much of the cell is exposed as h<sub>t</sub>",
  "Interpolates between keeping the old state and writing the candidate",
  "Scales the old cell state: near 1 keeps it, near 0 erases it",
  "Controls how much of the previous state is used to form the candidate",
  "Set to 1 so the cell starts out remembering",
  "Vanilla RNN or 1D-CNN is the suggested starting point",
  "Found no gating variant clearly better than the standard LSTM",
  "W x<sub>t</sub>, W<sub>f</sub> x<sub>t</sub>, and W<sub>r</sub> x<sub>t</sub> for all T steps in one matrix multiply",
  "Decide what new content is written into the cell"
];
var MM_A = ["D","J","B","C","E","A","F","I","H","G"];
var LET = ["A","B","C","D","E","F","G","H","I","J"];

var MC = [
  {q:"An LSTM has D = 64 input features and H = 32 hidden units. Using 4H(D + H + 1), how many parameters does it have?", calc:true,
   o:["9,312","12,288","12,416","3,104"], a:2, why:"4 × 32 × (64 + 32 + 1) = 128 × 97 = 12,416. The +1 is the bias vector. (9,312 is a GRU, 3,104 is a vanilla RNN.)"},
  {q:"A GRU has D = 50 and H = 100. Using 3H(D + H + 1), how many parameters does it have?", calc:true,
   o:["15,100","45,300","60,400","45,000"], a:1, why:"3 × 100 × (50 + 100 + 1) = 300 × 151 = 45,300."},
  {q:"An SRU has D = H = 64. Using 3HD + 4H, how many parameters does it have?", calc:true,
   o:["12,544","16,384","8,256","12,288"], a:0, why:"3 × 64 × 64 + 4 × 64 = 12,288 + 256 = 12,544. The 4H term holds the gate biases and the elementwise vectors v<sub>f</sub> and v<sub>r</sub>."},
  {q:"An LSTM step has c<sub>t−1</sub> = 1.5, f<sub>t</sub> = 0.6, i<sub>t</sub> = 0.5, and g<sub>t</sub> = 0.8. What is c<sub>t</sub>?", calc:true,
   o:["2.3","0.9","1.3","1.5"], a:2, why:"c<sub>t</sub> = f<sub>t</sub> ⊙ c<sub>t−1</sub> + i<sub>t</sub> ⊙ g<sub>t</sub> = 0.6(1.5) + 0.5(0.8) = 0.9 + 0.4 = 1.3."},
  {q:"A GRU step has z<sub>t</sub> = 0.25, h<sub>t−1</sub> = 0.8, and candidate h̃<sub>t</sub> = −0.4. What is h<sub>t</sub>?", calc:true,
   o:["0.4","−0.1","0.7","0.5"], a:3, why:"h<sub>t</sub> = (1 − z<sub>t</sub>) h<sub>t−1</sub> + z<sub>t</sub> h̃<sub>t</sub> = 0.75(0.8) + 0.25(−0.4) = 0.60 − 0.10 = 0.5."},
  {q:"An LSTM keeps its forget gate at f = 0.95 for 20 steps along the cell-state path. About what fraction of the gradient remains?", calc:true,
   o:["95%","64%","36%","5%"], a:2, why:"The direct path multiplies by f at every step: 0.95²⁰ = 0.358, about 36%. A vanilla RNN factor of 0.9 over 20 steps leaves only 12%."},
  {q:"Why can an SRU train much faster than an LSTM on a GPU?", calc:false,
   o:["It uses fewer layers than an LSTM","It removes the cell state entirely","It replaces sigmoid gates with ReLU","Its gates use an elementwise term v ⊙ c<sub>t−1</sub> instead of a matrix times h<sub>t−1</sub>, so the matrix products for all T steps batch into one multiply"], a:3,
   why:"In LSTM and GRU, step t cannot start until h<sub>t−1</sub> is ready, so T large matrix products run one after another. SRU leaves only cheap elementwise updates sequential."},
  {q:"At the same D and H, how many more parameters does an LSTM have than a GRU?", calc:true,

  {q:"Which cell does the lecture suggest as a starting point for long sequences when GPU training time is the constraint?", calc:false,
   o:["Vanilla RNN","LSTM with forget bias 1 and gradient clipping","Bidirectional GRU","SRU (or convolutional or attention models)"], a:3,
   why:"SRU targets speed. LSTM with forget bias 1 is the strong default for long dependencies, and GRU or a small LSTM suits streaming and edge devices."},
  {q:"An LSTM has o<sub>t</sub> = 0.5 and c<sub>t</sub> = 1.3. What is the hidden state h<sub>t</sub> = o<sub>t</sub> ⊙ tanh(c<sub>t</sub>)?", calc:true,

  {pts:3, title:"Problem 2",

      {id:"c",l:"h<sub>t</sub> = r<sub>t</sub> g(c<sub>t</sub>) + (1 − r<sub>t</sub>) x<sub>t</sub>",v:1.087,t:0.006,u:""}],

  {pts:2, title:"Problem 4",

   f:[{id:"a",l:"GRU weights as a percent of LSTM weights",v:75,t:0.1,u:"%"},
      {id:"b",l:"SRU weights as a percent of LSTM weights",v:37.7,t:0.1,u:"%"},
      {id:"c",l:"Gradient left after 50 steps at factor 0.99 (LSTM memory path)",v:0.605,t:0.006,u:""},
      {id:"d",l:"Gradient left after 50 steps at factor 0.9 (vanilla RNN)",v:0.005,t:0.0006,u:""}],
   sol:"GRU / LSTM = 98,688 / 131,584 = 0.750 → 75.0%\nSRU / LSTM = 49,664 / 131,584 = 0.3774 → 37.7%\n0.99^50 = 0.605  (about 60% of the gradient survives)\n0.9^50  = 0.00515 (about 0.5%, vanished)\nThe additive cell path with f near 1 keeps the gradient alive."}
];

var TABS = ["I · True or False","II · Matching","III · Multiple choice","IV · Computation","Results"];
var MAXPTS = 50;
var S;
function fresh() { return {tab:0, tf:{}, mc:{}, mm:{}, mmDone:false, inp:{}, cp:{}}; }
S = fresh();

function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function fmt(n) { return String(Math.round(n * 10) / 10); }
function parseNum(s) { s = String(s == null ? "" : s).replace(/[,\s%]/g,""); return s === "" ? NaN : Number(s); }
function commas(n) { return n >= 1000 && Math.floor(n) === n ? n.toLocaleString("en-US") : String(n); }

/* scoring */
function tfScore() { var n = 0, i; for (i = 0; i < TF.length; i++) if (S.tf[i] !== undefined && S.tf[i] === TF[i][1]) n++; return n; }
function tfDone() { return Object.keys(S.tf).length; }
function mcScore() { var n = 0, i; for (i = 0; i < MC.length; i++) if (S.mc[i] === MC[i].a) n++; return n * 2; }
function mcDone() { return Object.keys(S.mc).length; }
function mmCorrect() { var n = 0, i; for (i = 0; i < 10; i++) if (S.mm[i] === MM_A[i]) n++; return n; }
function mmFilled() { return Object.keys(S.mm).filter(function (k) { return S.mm[k]; }).length; }
function cpScoreOf(p) { var r = S.cp[p]; if (!r) return 0; var ok = r.filter(Boolean).length; return CP[p].pts * ok / r.length; }
function cpScore() { var n = 0, p; for (p = 0; p < CP.length; p++) n += cpScoreOf(p); return n; }
function cpDone() { return Object.keys(S.cp).length; }
function totals() {
  var earned = tfScore() + mcScore() + (S.mmDone ? mmCorrect() : 0) + cpScore();
  var att = tfDone() + mcDone() * 2 + (S.mmDone ? 10 : 0), p;
  for (p = 0; p < CP.length; p++) if (S.cp[p]) att += CP[p].pts;
  return {earned: earned, att: att};
}

/* chrome */
function renderBar() {
  var t = totals();
  document.getElementById("score").innerHTML = fmt(t.earned) + " <small>/ " + MAXPTS + " pts</small>";
  document.getElementById("att").style.width = (t.att / MAXPTS * 100) + "%";
  document.getElementById("earn").style.width = (t.earned / MAXPTS * 100) + "%";
  document.getElementById("attempted").textContent = fmt(t.att) + " of " + MAXPTS + " attempted";
  var st = [tfDone() + "/10", (S.mmDone ? "10" : mmFilled()) + "/10", mcDone() + "/10", cpDone() + "/4", ""];
  document.getElementById("tabs").innerHTML = TABS.map(function (n, i) {
    return '<button class="tab" role="tab" data-act="tab" data-t="' + i + '" aria-selected="' + (S.tab === i) + '">' + n + (st[i] ? '<span class="st">' + st[i] + '</span>' : '') + '</button>';
  }).join("");
}

function partHead(t, p) { return '<div class="part-head"><h2>' + t + '</h2><p>' + p + '</p></div>'; }
function nextBtn(label) { return '<div class="actions"><button class="btn ghost" data-act="tab" data-t="' + (S.tab + 1) + '">' + label + '</button></div>'; }

/* Part I */
function viewTF() {
  var h = partHead("True or False", "Pick True or False. Each statement is worth 1 point. For false statements the feedback gives the corrected version.");
  h += '<div class="stack">' + TF.map(function (it, i) {
    var a = S.tf[i], done = a !== undefined, right = done && a === it[1];
    function b(v, label) {
      var cls = "opt";
      if (done) { if (v === it[1]) cls += " correct"; else if (v === a) cls += " wrong"; }
      return '<button class="' + cls + '" data-act="tf" data-i="' + i + '" data-v="' + v + '"' + (done ? " disabled" : "") + '>' + label + '</button>';
    }
    return '<div class="q"><div class="qtop"><span class="num">' + (i + 1) + '</span><p class="qtext">' + it[0] + '</p></div>' +
      '<div class="opts two">' + b(true, "True") + b(false, "False") + '</div>' +
      (done ? '<div class="why"><b class="' + (right ? "ok" : "no") + '">' + (right ? "Correct. " : "Not quite. ") + '</b>' + it[2] + '</div>' : '') + '</div>';
  }).join("") + '</div>';
  return h + nextBtn("Next: Matching");
}

/* Part II */
function viewMM() {
  var h = partHead("Matching type", "Match each term to its description. Every letter is used once. Each correct match is worth 1 point.");
  var rows = MM_T.map(function (t, i) {
    var v = S.mm[i] || "", cls = "mrow", fix = "";
    if (S.mmDone) { if (v === MM_A[i]) cls += " correct"; else { cls += " wrong"; fix = '<div class="fix">Answer: ' + MM_A[i] + '</div>'; } }
    var opts = '<option value="">—</option>' + LET.map(function (l) { return '<option value="' + l + '"' + (v === l ? " selected" : "") + '>' + l + '</option>'; }).join("");
    return '<div class="' + cls + '"><span class="num">' + (i + 1) + '</span><span class="t">' + t + '</span>' +
      '<select id="mm' + i + '" data-act="mm" data-i="' + i + '" aria-label="Match for ' + esc(t) + '"' + (S.mmDone ? " disabled" : "") + '>' + opts + '</select>' + fix + '</div>';
  }).join("");
  var legend = '<ul class="legend"><li class="legend-title">Column B</li>' + MM_D.map(function (d, i) { return '<li><b>' + LET[i] + '</b><span>' + d + '</span></li>'; }).join("") + '</ul>';
  var h2 = h + '<div class="mgrid"><div class="mrows">' + rows + '</div>' + legend + '</div>';
  if (S.mmDone) {
    h2 += '<div class="actions"><span class="note">You matched ' + mmCorrect() + ' of 10 correctly.</span></div>' + nextBtn("Next: Multiple choice");
  } else {
    h2 += '<div class="actions"><button class="btn" data-act="mmcheck" id="mmcheck"' + (mmFilled() === 10 ? "" : " disabled") + '>Check matches</button><span class="note" id="mmnote">Fill all 10 rows to check.</span></div>';
  }
  return h2;
}

/* Part III */
function viewMC() {
  var h = partHead("Multiple choice", "Choose the best answer. Each item is worth 2 points. Items marked Computation have a worked solution in the feedback.");
  h += '<div class="stack">' + MC.map(function (it, i) {
    var a = S.mc[i], done = a !== undefined, right = done && a === it.a;
    var opts = it.o.map(function (o, j) {
      var cls = "opt";
      if (done) { if (j === it.a) cls += " correct"; else if (j === a) cls += " wrong"; }
      return '<button class="' + cls + '" data-act="mc" data-i="' + i + '" data-o="' + j + '"' + (done ? " disabled" : "") + '><span class="k">' + "abcd"[j] + ')</span><span>' + o + '</span></button>';
    }).join("");
    return '<div class="q"><div class="qtop"><span class="num">' + (i + 1) + '</span><p class="qtext">' + it.q + (it.calc ? '<span class="tag">Computation</span>' : '') + '</p></div>' +
      '<div class="opts">' + opts + '</div>' +
      (done ? '<div class="why"><b class="' + (right ? "ok" : "no") + '">' + (right ? "Correct. " : "Not quite. ") + '</b>' + it.why + '</div>' : '') + '</div>';
  }).join("") + '</div>';
  return h + nextBtn("Next: Computation");
}

/* Part IV */
function viewCP() {
  var h = partHead("Computation problems", "Type your answers, then check. Commas and a % sign are fine. Rounded answers within a small tolerance count as correct.");
  h += '<div class="stack">' + CP.map(function (p, pi) {
    var res = S.cp[pi], earned = cpScoreOf(pi);
    var fields = p.f.map(function (f, fi) {
      var id = "cp" + pi + f.id, val = S.inp[id] || "", cls = "field", exp = "";
      if (res) { cls += res[fi] ? " ok" : " no"; if (!res[fi]) exp = '<div class="exp">Expected ' + commas(f.v) + (f.u || "") + '</div>'; }
      return '<div class="' + cls + '"><label for="' + id + '">' + f.l + '</label><input id="' + id + '" type="text" inputmode="decimal" autocomplete="off" data-act="inp" value="' + esc(val) + '"' + (res ? " disabled" : "") + ' placeholder="' + (f.u ? "value in " + f.u : "value") + '">' + exp + '</div>';
    }).join("");
    return '<div class="q"><div class="qtop"><span class="num">' + (pi + 1) + '</span><p class="qtext"><b>' + p.title + '</b></p><span class="pts">' + (res ? fmt(earned) + " / " : "") + p.pts + ' pts</span></div>' +
      '<p class="given">' + p.given + '</p><div class="fields">' + fields + '</div>' +
      (res ? '<div class="sol"><span class="sol-title">Worked solution</span>' + esc(p.sol) + '</div>' : '<div class="actions"><button class="btn" data-act="cpcheck" data-p="' + pi + '">Check answers</button></div>') + '</div>';
  }).join("") + '</div>';
  return h + '<div class="actions"><button class="btn ghost" data-act="tab" data-t="4">See results</button></div>';
}

/* Results */
function missed(kind) {
  var out = [], i;
  if (kind === "tf") { for (i = 0; i < 10; i++) if (S.tf[i] !== TF[i][1]) out.push(i + 1); }
  if (kind === "mc") { for (i = 0; i < 10; i++) if (S.mc[i] !== MC[i].a) out.push(i + 1); }
  if (kind === "mm") { for (i = 0; i < 10; i++) if (!S.mmDone || S.mm[i] !== MM_A[i]) out.push(i + 1); }
  if (kind === "cp") { for (i = 0; i < 4; i++) if (!S.cp[i] || cpScoreOf(i) < CP[i].pts) out.push(i + 1); }
  return out;
}
function viewRes() {
  var t = totals(), pct = Math.round(t.earned / MAXPTS * 100);
  var msg = pct >= 90 ? "Excellent command of the material." : pct >= 75 ? "Solid. Review the items listed below." : pct >= 60 ? "Passing. Revisit the slides for the items listed below." : "Review the deck, especially the parts with missed items, then retake.";
  if (t.att < MAXPTS) msg = "You have attempted " + fmt(t.att) + " of " + MAXPTS + " points. " + (t.att ? "Finish the remaining items for a full score." : "Start with Part I.");
  var parts = [
    ["Part I · True or False", tfScore(), 10, "tf"],
    ["Part II · Matching", S.mmDone ? mmCorrect() : 0, 10, "mm"],
    ["Part III · Multiple choice", mcScore(), 20, "mc"],
    ["Part IV · Computation", cpScore(), 10, "cp"]
  ];
  var rows = parts.map(function (p) {
    var m = missed(p[3]);
    return '<div class="rrow"><div class="rl"><span>' + p[0] + '</span><span>' + fmt(p[1]) + ' / ' + p[2] + '</span></div>' +
      '<div class="track"><i class="earn" style="width:' + (p[1] / p[2] * 100) + '%"></i></div>' +
      '<div class="miss">' + (m.length ? "Items to review: " + m.join(", ") : "No items to review") + '</div></div>';
  }).join("");
  return partHead("Results", "Your score by part.") +
    '<div class="result"><div class="big">' + fmt(t.earned) + ' <small>/ ' + MAXPTS + ' pts · ' + pct + '%</small></div><p>' + msg + '</p><div class="rows">' + rows + '</div>' +
    '<div class="actions"><button class="btn" data-act="retake">Retake quiz</button></div></div>';
}

function render() {
  var v = [viewTF, viewMM, viewMC, viewCP, viewRes][S.tab]();
  document.getElementById("view").innerHTML = v;
  renderBar();
}

/* events */
var view = document.getElementById("view");
document.addEventListener("click", function (e) {
  var el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  var act = el.getAttribute("data-act");
  if (act === "tab") { S.tab = Number(el.getAttribute("data-t")); render(); window.scrollTo(0, 0); }
  else if (act === "tf") { S.tf[Number(el.getAttribute("data-i"))] = el.getAttribute("data-v") === "true"; render(); }
  else if (act === "mc") { S.mc[Number(el.getAttribute("data-i"))] = Number(el.getAttribute("data-o")); render(); }
  else if (act === "mmcheck") { S.mmDone = true; render(); }
  else if (act === "cpcheck") {
    var p = Number(el.getAttribute("data-p"));
    S.cp[p] = CP[p].f.map(function (f) {
      var n = parseNum(S.inp["cp" + p + f.id]);
      return !isNaN(n) && Math.abs(n - f.v) <= f.t;
    });
    render();
  }
  else if (act === "retake") { S = fresh(); render(); window.scrollTo(0, 0); }
});
document.addEventListener("change", function (e) {
  var el = e.target;
  if (el.getAttribute && el.getAttribute("data-act") === "mm") {
    var i = Number(el.getAttribute("data-i"));
    if (el.value) S.mm[i] = el.value; else delete S.mm[i];
    var n = mmFilled(), btn = document.getElementById("mmcheck"), note = document.getElementById("mmnote");
    if (btn) btn.disabled = n !== 10;
    if (note) note.textContent = n === 10 ? "Ready to check." : "Fill all 10 rows to check (" + n + " of 10).";
    renderBar();
  }
});
document.addEventListener("input", function (e) {
  var el = e.target;
  if (el.getAttribute && el.getAttribute("data-act") === "inp") S.inp[el.id] = el.value;
});
render();
</script>

</body></html>
