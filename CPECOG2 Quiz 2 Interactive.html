map((o,i)=>[String.fromCharCode(65+i),o])).map(([k,o])=>'<button data-n="'+q.n+'" data-v="'+k+'" '+(done?'disabled':'')+' class="'+(done&&k===q.a?'correct ':'')+(done&&k===chosen&&k!==q.a?'wrong':'')+'">'+(type==='tf'?o:k+'. '+esc(o))+'</button>').join('')+'</div>'}return '<article class="q '+(done?(ok?'correct':'wrong'):'')+'"><div class="qhead"><span class="num">'+q.n+'</span><p class="question">'+esc(q.q)+'</p></div>'+body+(done?'<div class="feedback '+(ok?'good':'bad')+'">'+(ok?'Correct!':'Not quite. Correct answer: '+q.a)+'</div>':'')+'</article>'}function update(){const qs=all(),done=qs.filter(q=>state[q.n]!==undefined).length,score=qs.filter(q=>state[q.n]===q.a).length;document.getElementById('score').textContent=score+' / 100';document.getElementById('bar').style.width=(done)+'%';document.getElementById('results').innerHTML=done===100?'<div class="results"><div class="big">Final score: '+score+' / 100 ('+score+'%)</div><p>'+(score===100?'Perfect score!':score>=75?'Great work! Review the items marked incorrect.':'Keep practicing and try the quiz again.')+'</p></div>':''}document.addEventListener('click',e=>{const b=e.target.closest('button[data-n]');if(!b)return;state[b.dataset.n]=b.dataset.v;render()});document.addEventListener('change',e=>{if(!e.target.matches('select[data-n]')||!e.target.value)return;state[e.target.dataset.n]=e.target.value;render()});document.getElementById('reset').onclick=()=>{Object.keys(state).forEach(k=>delete state[k]);render();scrollTo(0,0)};document.getElementById('finish').onclick=()=>{document.getElementById('results').innerHTML='<div class="results"><div class="big">Current score: '+document.getElementById('score').textContent+'</div><p>Completed: '+Object.keys(state).length+' / 100. Finish all items for your final score.</p></div>';document.getElementById('results').scrollIntoView({behavior:'smooth'})};render();</script></body></html>
